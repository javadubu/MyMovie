<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#141414">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet"></noscript>
<title>کتابخانه سریال</title>
<style>
  :root { --bg:#141414; --panel:#1f1f1f; --panel2:#2a2a2a; --text:#fff; --muted:#a3a3a3; --accent:#e50914; --accent2:#b20710; --border:#333; --hh:68px; }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Vazirmatn",Tahoma,"Segoe UI",system-ui,sans-serif; line-height:1.6; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }
  button { font-family:inherit; cursor:pointer; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline:3px solid #fff; outline-offset:3px; }

  /* ===== هدر ===== */
  header { position:fixed; top:0; left:0; right:0; z-index:30; display:flex; align-items:center; height:var(--hh); padding:0 4%; background:linear-gradient(to bottom,rgba(0,0,0,.9),rgba(0,0,0,0)); transition:background .3s; }
  header.solid { background:rgba(20,20,20,.97); box-shadow:0 2px 24px rgba(0,0,0,.6); }
  .brand { margin-left:26px; font-weight:900; font-size:1.55rem; color:var(--accent); white-space:nowrap; text-shadow:0 2px 14px rgba(0,0,0,.6); }
  .hnav { display:flex; }
  .hnav button { background:none; border:0; color:#e5e5e5; font-size:.92rem; padding:6px 12px; border-radius:4px; transition:color .2s; white-space:nowrap; }
  .hnav button:hover { color:#9a9a9a; }
  .hnav button.on { color:#fff; font-weight:800; }
  .search { width:190px; margin-right:auto; padding:8px 16px; border-radius:4px; border:1px solid rgba(255,255,255,.35); background:rgba(0,0,0,.45); color:#fff; font-size:.9rem; font-family:inherit; transition:width .3s,border-color .3s; }
  .search:focus { width:300px; border-color:#fff; }
  .search::placeholder { color:#9a9a9a; }
  .adm { margin-right:10px; padding:7px 14px; white-space:nowrap; }

  /* ===== چیدمان صفحه ===== */
  main { display:block; }
  #app.wide { padding:0 0 60px; }
  #app.narrow { max-width:1100px; margin:0 auto; padding:calc(var(--hh) + 22px) 16px 50px; }
  h2 { font-size:1.1rem; margin:24px 0 12px; }
  .empty { color:var(--muted); padding:30px 0; text-align:center; }
  .sec { padding:calc(var(--hh) + 28px) 4% 0; }

  /* ===== دکمه‌ها ===== */
  .btn { display:inline-block; background:var(--accent); color:#fff; border:0; border-radius:4px; padding:9px 20px; font-weight:700; font-size:.92rem; transition:background .2s,opacity .2s; }
  .btn:hover { background:var(--accent2); }
  .btn.ghost { background:rgba(109,109,110,.55); border:0; color:#fff; font-weight:600; }
  .btn.ghost:hover { background:rgba(109,109,110,.8); }
  .btn.light { background:#fff; color:#000; font-weight:800; }
  .btn.light:hover { background:rgba(255,255,255,.75); }
  .btn:disabled { opacity:.4; cursor:not-allowed; }

  /* ===== بنر اصلی ===== */
  .hero { position:relative; min-height:80vh; display:flex; align-items:flex-end; padding:calc(var(--hh) + 40px) 4% 110px; overflow:hidden; background:#000; }
  .hero-bg { position:absolute; top:-40px; left:-40px; right:-40px; bottom:-40px; background-size:cover; background-position:center; opacity:.5; filter:blur(18px); -webkit-filter:blur(18px); }
  .hero-bg { transition:opacity .6s; }
  .hero-txt, .hero-art { transition:opacity .25s; }
  .hero.swap .hero-txt, .hero.swap .hero-art { opacity:0; }
  .amb { position:fixed; top:-60px; left:-60px; right:-60px; bottom:-60px; z-index:0; background-size:cover; background-position:center; filter:blur(40px) saturate(1.2); -webkit-filter:blur(40px) saturate(1.2); opacity:0; transition:opacity .7s; pointer-events:none; }
  .amb.on { opacity:.32; }
  .info { background:rgba(0,0,0,.5); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.12); border-radius:8px; padding:14px 18px; font-size:.9rem; line-height:1.8; text-align:right; }
  .info .ir { margin-bottom:6px; } .info .ir:last-child { margin-bottom:0; }
  .info .ik { display:block; color:var(--muted); font-size:.76rem; font-weight:700; }
  .info .iv { color:#eee; }
  .info .plot { color:#d6d6d6; }
  .hero-info { flex:none; width:300px; margin:0 26px; align-self:flex-end; }
  .detail-info { margin:4px 0 18px; max-width:760px; }
  @media (max-width:900px) { .hero-info { display:none; } }
  .hero:before { content:""; position:absolute; top:0; left:0; right:0; bottom:0; background:linear-gradient(to left,rgba(20,20,20,.9) 0%,rgba(20,20,20,.35) 55%,rgba(20,20,20,.55) 100%); }
  .hero:after { content:""; position:absolute; left:0; right:0; bottom:0; height:50%; background:linear-gradient(to bottom,rgba(20,20,20,0),var(--bg)); }
  .hero-in { position:relative; z-index:2; display:flex; align-items:flex-end; width:100%; }
  .hero-txt { flex:1; max-width:560px; }
  .hero-tag { display:inline-block; font-size:.78rem; font-weight:800; letter-spacing:.5px; padding:2px 10px; border-radius:3px; background:var(--accent); margin-bottom:12px; }
  .hero-t { margin:0 0 10px; font-size:2.3rem; font-size:clamp(2.1rem,5.2vw,3.8rem); font-weight:900; line-height:1.25; text-shadow:0 4px 24px rgba(0,0,0,.7); }
  .hero-m { color:#d2d2d2; font-size:1rem; margin-bottom:22px; text-shadow:0 2px 10px rgba(0,0,0,.6); }
  .hero-b .btn { padding:11px 26px; font-size:1.02rem; margin-left:10px; }
  .hero-art { flex:none; width:210px; height:315px; margin-right:auto; border-radius:8px; background-size:cover; background-position:center; box-shadow:0 20px 60px rgba(0,0,0,.75); border:1px solid rgba(255,255,255,.12); }

  /* ===== ردیف‌های افقی ===== */
  .rows { position:relative; z-index:3; margin-top:-80px; }
  .shelf { margin-bottom:6px; }
  .shelf { position:relative; }
  .arr { position:absolute; top:52px; bottom:30px; width:48px; z-index:8; border:0; background:rgba(20,20,20,.75); color:#fff; font-size:2.2rem; line-height:1; opacity:0; transition:opacity .2s,background .2s; }
  .arr.l { left:0; } .arr.r { right:0; }
  .shelf:hover .arr, .arr:focus { opacity:1; }
  .arr:hover { background:rgba(229,9,20,.85); }
  @media (hover:none) { .arr { display:none; } }
  .rowt { font-size:1.3rem; font-weight:800; margin:18px 0 0; padding:0 4%; }
  .rail { display:flex; overflow-x:auto; padding:20px 4% 30px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .rail::-webkit-scrollbar { display:none; }
  .rail .poster { flex:none; margin-left:12px; }

  /* سازگار با مرورگر قدیمی تلویزیون: اول چیدمان flex، و اگر مرورگر grid داشت همان استفاده می‌شود */
  .grid { display:flex; flex-wrap:wrap; margin:16px 0 0; }
  .grid .poster { margin:0 0 14px 12px; }
  @supports (display:grid) {
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); grid-gap:16px; gap:16px; }
    .grid .poster { width:auto; margin:0; }
  }

  /* ===== کارت پوستر ===== */
  .poster { position:relative; display:flex; flex-direction:column; justify-content:flex-end; width:170px; min-height:255px; padding:12px; border-radius:6px; overflow:hidden; background-size:cover; background-position:center; transition:transform .25s,box-shadow .25s; }
  @supports (aspect-ratio:2/3) { .poster { aspect-ratio:2/3; min-height:0; } }
  .poster:after { content:""; position:absolute; left:0; right:0; bottom:0; height:62%; background:linear-gradient(to top,rgba(0,0,0,.92),rgba(0,0,0,0)); z-index:1; }
  .poster:hover, .poster:focus { transform:scale(1.07); z-index:6; box-shadow:0 16px 36px rgba(0,0,0,.75); }
  .poster .name { position:relative; z-index:2; font-weight:800; font-size:1rem; line-height:1.4; text-shadow:0 2px 8px rgba(0,0,0,.6); }
  .poster .cnt { position:relative; z-index:2; font-size:.76rem; color:rgba(255,255,255,.75); margin-top:1px; }
  .poster .ini { position:absolute; top:6px; right:12px; font-size:3.8rem; font-weight:900; opacity:.2; line-height:1; }
  .star { position:absolute; z-index:3; top:8px; left:10px; color:#ffd166; font-size:1.25rem; line-height:1; text-shadow:0 1px 6px rgba(0,0,0,.7); }
  .pbar { position:absolute; z-index:3; left:0; right:0; bottom:0; height:4px; background:rgba(255,255,255,.25); }
  .pbar i { display:block; height:100%; background:var(--accent); }

  /* ===== سایت‌ها و شبکه‌ها ===== */
  .lbox { display:flex; flex-wrap:wrap; padding:14px 4% 0; }
  .lcard { display:flex; align-items:center; background:var(--panel); border-radius:6px; padding:9px 12px; margin:0 0 10px 10px; transition:background .2s; }
  .lcard:hover { background:var(--panel2); }
  .lcard .lkimg { margin-left:10px; }
  .lcard .lname { font-weight:700; margin-left:12px; }
  .lcard .lname:hover { color:var(--accent); }
  .lcard .btn { padding:6px 12px; font-size:.8rem; }

  /* ===== صفحه‌ی پخش ===== */
  .back { display:inline-flex; align-items:center; gap:6px; margin-bottom:14px; color:var(--muted); transition:color .2s; }
  .back:hover { color:#fff; }
  .player-wrap { position:relative; background:#000; border-radius:8px; overflow:hidden; box-shadow:0 18px 60px rgba(0,0,0,.7); }
  video { display:block; width:100%; max-height:74vh; background:#000; }
  .err { padding:10px 14px; background:#3a1214; color:#ffb3b8; font-size:.88rem; }
  .meta { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin:20px 0 8px; }
  .meta h1 { margin:0; font-size:1.8rem; font-weight:900; }
  .meta .ep { color:var(--muted); font-size:.95rem; }
  .nav { display:flex; }
  .nav .btn + .btn { margin-right:8px; }
  .ctl { display:flex; flex-wrap:wrap; direction:ltr; justify-content:flex-start; margin:0 0 6px; padding:8px 8px 0; background:var(--panel); border-radius:0 0 8px 8px; }
  .ctl .btn { margin:0 8px 8px 0; padding:7px 14px; font-size:.82rem; direction:ltr; min-width:52px; text-align:center; }
  .chips { display:flex; flex-wrap:wrap; }
  @supports (display:grid) { .chips { display:grid; grid-template-columns:repeat(auto-fill,minmax(70px,1fr)); grid-gap:8px; gap:8px; } .chip { width:auto; margin:0; } }
  .chip { width:70px; margin:0 0 8px 8px; padding:12px 4px; border-radius:4px; border:0; background:var(--panel2); color:#fff; font-weight:700; direction:ltr; transition:background .2s; }
  .chip:hover { background:#3a3a3a; }
  .chip.on { background:var(--accent); color:#fff; }
  .chip.seen { color:var(--muted); }
  .chip.on.seen { color:#fff; }
  /* ابزارهای داخل پلیر */
  .ctl-in { position:absolute; bottom:60px; left:10px; z-index:5; display:flex; flex-wrap:wrap; gap:6px; direction:ltr; max-width:calc(100% - 20px); transition:opacity .3s; }
  .ctl-in .btn { margin:0; padding:6px 12px; font-size:.8rem; min-width:44px; text-align:center; direction:ltr; background:rgba(0,0,0,.6); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }
  .ctl-in .btn:hover { background:rgba(0,0,0,.85); }
  .ctl-in .btn:not(.ghost) { background:var(--accent); }
  .player-wrap.idle .ctl-in { opacity:0; pointer-events:none; }
  .player-wrap:fullscreen { display:flex; align-items:center; background:#000; border-radius:0; }
  .player-wrap:fullscreen video { max-height:100vh; height:100vh; }
  /* ===== فلش / حافظه ===== */
  .lpick { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 10px; }
  .lpick .btn { margin:0; }
  .ltabs { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; }
  .ltabs .btn { margin:0; }
  .apl { background:var(--panel); border-radius:8px 8px 0 0; padding:18px 16px 10px; }
  .apl audio { width:100%; display:block; }
  .lgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); grid-gap:8px; gap:8px; }
  .lth { display:block; padding:0; border:0; background:var(--panel2); border-radius:4px; overflow:hidden; height:150px; }
  .lth img, .lth canvas { width:100%; height:100%; object-fit:cover; display:block; }
  .dl .dli { content-visibility:auto; contain-intrinsic-size:auto 44px; }
  .lb { position:fixed; top:0; left:0; right:0; bottom:0; z-index:100; background:rgba(0,0,0,.95); display:flex; align-items:center; justify-content:center; direction:ltr; }
  .lb img { max-width:100%; max-height:100%; object-fit:contain; }
  .lbn { position:absolute; background:rgba(0,0,0,.55); color:#fff; border:0; border-radius:50%; width:48px; height:48px; font-size:1.6rem; line-height:48px; padding:0; }
  .lbn:hover { background:rgba(255,255,255,.25); }
  .lbl { left:12px; top:50%; margin-top:-24px; } .lbr { right:12px; top:50%; margin-top:-24px; } .lbx { right:12px; top:12px; }
  .lbc { position:absolute; left:0; right:0; bottom:0; padding:10px 70px; text-align:center; font-size:.85rem; color:#ddd; background:linear-gradient(to top,rgba(0,0,0,.7),rgba(0,0,0,0)); direction:auto; }
  .skipfx { position:absolute; top:50%; margin-top:-28px; padding:12px 18px; border-radius:999px; background:rgba(0,0,0,.65); color:#fff; font-weight:700; font-size:1rem; pointer-events:none; opacity:0; transition:opacity .2s; }
  .skipfx.show { opacity:1; }
  .skipfx.r { right:12%; } .skipfx.l { left:12%; }
  .dli { display:block; width:100%; text-align:right; padding:11px 14px; margin-bottom:6px; border-radius:4px; border:0; background:var(--panel2); color:#fff; font-size:.9rem; }
  .dli:hover { background:#3a3a3a; }
  .dli.on { background:var(--accent); color:#fff; }
  .dli.seen { color:var(--muted); } .dli.on.seen { color:#fff; }

  /* ===== مدیریت ===== */
  .card { background:var(--panel); border:1px solid #2c2c2c; border-radius:8px; padding:16px; margin-bottom:16px; }
  .fld { display:block; margin-bottom:12px; }
  .fld span { display:block; font-size:.85rem; color:var(--muted); margin-bottom:4px; }
  .fld small { display:block; color:var(--muted); font-size:.75rem; margin-top:3px; }
  .in { width:100%; padding:10px 12px; border-radius:4px; border:1px solid #3d3d3d; background:#333; color:#fff; font-family:inherit; font-size:.95rem; }
  .in:focus { border-color:#fff; outline:0; }
  .ltr { direction:ltr; text-align:left; }
  .row { display:flex; } .row .fld { flex:1; margin-left:10px; } .row .fld:last-child { margin-left:0; }
  .chk { display:block; margin-bottom:12px; }
  .li { display:flex; align-items:center; padding:9px 0; border-bottom:1px solid #2c2c2c; }
  .li .n { flex:1; } .li .n small { color:var(--muted); }
  .li .btn { margin-right:8px; padding:6px 12px; font-size:.8rem; }
  .msg { color:#ffb3b8; font-size:.88rem; margin:8px 0; min-height:1.2em; }
  .acts .btn { margin-left:8px; }
  .lk { display:flex; flex-wrap:wrap; align-items:center; padding:9px 0; border-bottom:1px solid #2c2c2c; }
  .lk .n { flex:1; min-width:0; } .lk .n small { display:block; color:var(--muted); direction:ltr; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lk .btn { margin-right:8px; margin-top:4px; padding:6px 12px; font-size:.8rem; display:inline-block; }
  select.in { appearance:auto; }
  .lkimg { width:40px; height:40px; margin-left:10px; border-radius:6px; background:var(--panel2); display:flex; align-items:center; justify-content:center; overflow:hidden; font-weight:800; color:var(--muted); flex:none; }
  .lkimg img { width:100%; height:100%; object-fit:cover; }

  /* ===== موبایل ===== */
  @media (max-width:720px) {
    :root { --hh:104px; }
    header { flex-wrap:wrap; align-content:center; padding:6px 4%; }
    .brand { font-size:1.3rem; margin-left:12px; }
    .search { width:120px; padding:6px 12px; } .search:focus { width:150px; }
    .hnav { order:3; width:100%; overflow-x:auto; }
    .hero { min-height:68vh; padding-bottom:90px; }
    .hero-art { display:none; }
    .poster { width:130px; min-height:195px; }
    .rowt { font-size:1.1rem; }
    .meta h1 { font-size:1.4rem; }
  }
</style>
</head>
<body>
<header id="hdr">
  <a class="brand" href="#/" id="brand"></a>
  <nav class="hnav" id="hnav"></nav>
  <input id="q" class="search" type="search" placeholder="جستجوی سریال..." aria-label="جستجو" autocomplete="off">
  <a class="btn ghost adm" href="#/admin">مدیریت</a>
</header>
<main id="app"></main>

<script>
/* ===== این لیست فقط نسخهٔ پشتیبان است. لیست اصلی در فایل data.json کنار همین فایل است و اگر آن لود شود جای این را می‌گیرد. =====
   ===== تنظیمات: =====
   هر سریال: عنوان، بخش ثابت آدرس (تا قبل از شماره‌ی قسمت)، از چند تا چند، تعداد رقم‌های شماره، پسوند.
   وقتی تعداد کل قسمت‌ها را فهمیدی فقط مقدار «to» را عوض کن. poster اختیاری است (آدرس عکس). */
const APP_NAME = 'کتابخانه سریال';
// بعد از ساخت Worker، آدرس workers.dev را اینجا قرار بده.
const API_BASE = 'https://movie-api.usfc26-psn.workers.dev';
let SERIES = [
  { id:'sorkho',    title:'سرخ و سیاه',      base:'https://stream.farsicdn.co/serials2/sorkho/Siah-E',            from:1, to:1,  pad:2, ext:'.mp4' },
  { id:'dore-amir', title:'دور امیر',         base:'https://stream.farsicdn.co/serials2/dore-amir/Dore-Amir-E',   from:1, to:2,  pad:2, ext:'.mp4' },
  { id:'yal',       title:'یل',               base:'https://stream.farsicdn.co/serials2/yal/Yal-E',               from:1, to:2,  pad:2, ext:'.mp4' },
  { id:'boys',      title:'بم استریم بوی',    base:'https://stream.farsicdn.co/serials2/backstream/Boys-E',       from:1, to:17, pad:2, ext:'.mp4' },
  /* prefix: پیشوند نام قسمت در دکمه‌ها (پیش‌فرض E). override: آدرس مخصوص یک قسمت که مسیرش با بقیه فرق دارد. */
  { id:'bamdad-khomar-2', title:'بامداد خمار فصل ۲', prefix:'S2E',
    base:'https://stream.farsicdn.co/serials2/bamdade/Khomar-S2E', from:0, to:13, pad:2, ext:'.mp4',
    override:{ 0:'https://stream.farsicdn.co/serials/bamdade/Khomar-S2E00.mp4' } },
  { id:'eteraf', title:'اعتراف می‌کنم', base:'https://stream.farsicdn.co/serials2/eteraf/Mikonam-E', from:1, to:10, pad:2, ext:'.mp4' },
  { id:'kalagh', title:'کلاغ', base:'https://stream.farsicdn.co/serials2/kalagh/Kalaq-E', from:1, to:11, pad:0, ext:'.mp4',
    override:{ 1:'https://stream.farsicdn.co/serials/kalagh/Kalaq.mp4', 2:'https://stream.farsicdn.co/serials/kalagh/Kalaq-E2.mp4' } },
  { id:'okazion', title:'اکازیون', base:'https://stream.farsicdn.co/serials/okazion/Okazion-E', from:1, to:8, pad:2, ext:'.mp4' },
  /* single:true یعنی فیلم تک‌قسمتی (بدون دکمه‌ی قسمت‌ها). */
  { id:'asb', title:'مردی که اسب شد', single:true, base:'', from:1, to:1, pad:0, ext:'',
    override:{ 1:'https://stream.farsicdn.co/movies/Mardi-Ke-Asb-Shod.mp4' } }
];
/* ======================================= */

/* سازگاری با مرورگر تلویزیون‌های قدیمی‌تر (Tizen): قابلیت‌هایی که ممکن است نداشته باشد */
(function () {
  var P = Element.prototype;
  function toNode(n) { return (typeof n === 'string' || typeof n === 'number') ? document.createTextNode(String(n)) : n; }

  /* ===== پلی‌لیست پوشه‌ی گوگل درایو ===== */
  function getJSON(url, ok, bad) {
    const x = new XMLHttpRequest(); x.open('GET', url, true);
    x.onreadystatechange = () => {
      if (x.readyState !== 4) return;
      let j = null; try { j = JSON.parse(x.responseText); } catch (e) {}
      if (x.status === 200 && j) ok(j); else bad((j && j.error && j.error.message) || ('خطا ' + x.status));
    };
    x.onerror = () => bad('اتصال به گوگل برقرار نشد.');
    x.send();
  }

     اگر یک سرویس واسط فیلتر یا از کار افتاده بود، دکمه‌ی «پلیر بعدی» را بزن. */
  const YT_SOURCES = [
    ['یوتیوب', 'https://www.youtube-nocookie.com/embed/{id}?rel=0'],

    const pick = el('div', 'lpick'); pick.append(bDir);
    let bCompat = null;
    if (hasApi) { bCompat = el('button', 'btn ghost', 'انتخاب پوشه (سازگار)'); pick.append(bCompat); }
    pick.append(bFiles, dirInp, fileInp); app.append(pick);
    const status = el('div', 'empty'); status.style.cssText = 'padding:2px 0;text-align:right'; status.hidden = true; app.append(status);
    const box = el('div'); app.append(box);
    const alive = () => box.isConnected;
    const say = (t, bad) => { status.textContent = t; status.className = bad ? 'err' : 'empty'; status.hidden = !t; };

    const setLib = (lib) => {
      localLib = lib; localFolder = '';
      if (!localLib[localTab].length) localTab = ['video', 'audio', 'image'].filter(k => localLib[k].length)[0] || 'video';
      say(''); paint();
    };
    const load = (fl) => { if (fl && fl.length) setLib(buildLib(fl)); };
    dirInp.onchange = () => load(dirInp.files); fileInp.onchange = () => load(fileInp.files);
    bFiles.onclick = () => fileInp.click();
    if (bCompat) bCompat.onclick = () => dirInp.click();

    async function loadHandles(hs) {
      say('در حال خواندن پوشه‌ها...');
      try {
        let base = 0; const libs = [];
        for (const h of hs) {
          const lib = await scanHandle(h, n => { if (alive()) say('در حال خواندن «' + h.name + '»... ' + toFa(base + n) + ' فایل'); });
          base += lib.video.length + lib.audio.length + lib.image.length; libs.push(lib);
        }
        if (alive()) setLib(libs.length === 1 ? libs[0] : mergeLibs(libs));
      } catch (e) { if (alive()) say('خواندن پوشه ناموفق بود. دوباره انتخاب کن.', true); }
    }
    bDir.onclick = async () => {
      if (!hasApi) { dirInp.click(); return; }
      try {
        const h = await window.showDirectoryPicker({ mode: 'read' });
        const all = await addSavedHandle(h);
        await loadHandles(all);
      } catch (e) { if (e && e.name !== 'AbortError') say('مرورگر اجازه‌ی باز کردن این پوشه را نمی‌دهد (مثلاً ریشه‌ی درایو یا پوشه‌ی سیستمی). یک پوشه‌ی داخل فلش را انتخاب کن یا «انتخاب پوشه (سازگار)» را بزن.', true); }
    };

    function paint() {
      freeUrls(); box.replaceChildren();
      if (!localLib) return;
      const total = localLib.video.length + localLib.audio.length + localLib.image.length;
      const info = el('div', 'empty', 'پوشه: ' + localLib.name + ' — ' + toFa(total) + ' فایل رسانه‌ای'); info.style.cssText = 'padding:2px 0;text-align:right'; box.append(info);
      if (!total) { box.append(el('div', 'empty', 'فیلم، موزیک یا عکسی در این پوشه پیدا نشد.')); return; }
      const tabs = el('div', 'ltabs');
      ['video', 'audio', 'image'].forEach(k => {
        const b = el('button', 'btn' + (k === localTab ? '' : ' ghost'), KIND_FA[k] + ' (' + toFa(localLib[k].length) + ')');
        b.onclick = () => { localTab = k; localFolder = ''; paint(); }; tabs.append(b);
      });
      box.append(tabs);
      let items = localLib[localTab];
      if (!items.length) { box.append(el('div', 'empty', 'در این بخش فایلی نیست.')); return; }
      /* فیلتر پوشه */
      const counts = {}; items.forEach(x => { const d = dirOf(x.path); counts[d] = (counts[d] || 0) + 1; });
      const dirs = Object.keys(counts).sort((x, y) => x.localeCompare(y, undefined, { numeric: true }));
      if (dirs.length > 1) {
        const sel = document.createElement('select'); sel.dir = 'auto';
        sel.style.cssText = 'max-width:100%;padding:9px 12px;border-radius:4px;border:1px solid var(--border);background:var(--panel2);color:#fff;font-family:inherit;margin-bottom:14px';
        const o0 = document.createElement('option'); o0.value = ''; o0.textContent = 'همه‌ی پوشه‌ها (' + toFa(items.length) + ')'; sel.append(o0);
        dirs.forEach(d => { const o = document.createElement('option'); o.value = d; o.textContent = d + ' (' + toFa(counts[d]) + ')'; sel.append(o); });
        sel.value = counts[localFolder] ? localFolder : ''; localFolder = sel.value;
        sel.onchange = () => { localFolder = sel.value; paint(); }; box.append(sel);
      } else localFolder = '';
      if (localFolder) items = items.filter(x => dirOf(x.path) === localFolder);
      box.append(localTab === 'image' ? photoGrid(items) : playerBlock(localTab, items));
    }

    /* لود خودکار پوشه‌های ذخیره‌شده (فلش، حافظه‌ی دستگاه، ...) */
    if (localLib) { paint(); }
    else if (hasApi) {
      savedHandles().then(async (hs) => {
        if (!hs.length || !alive() || localLib) return;
        const ok = [], need = [];
        for (const h of hs) {
          let perm = 'prompt'; try { perm = await h.queryPermission({ mode: 'read' }); } catch (e) {}
          (perm === 'granted' ? ok : need).push(h);
        }
        if (!alive()) return;
        if (!need.length) { loadHandles(ok); return; }
        const names = hs.map(h => h.name).join(' + ');
        const b = el('button', 'btn', '🔓 لود خودکار: ' + names);
        b.onclick = async () => {
          const got = [];
          for (const h of hs) { try { if ((await h.requestPermission({ mode: 'read' })) === 'granted') got.push(h); } catch (e) {} }
          b.remove(); if (got.length) loadHandles(got); else say('اجازه‌ی دسترسی داده نشد (اگر فلش وصل نیست، اول وصلش کن).', true);
        };
        const clr = el('button', 'btn ghost', 'پاک کردن پوشه‌های ذخیره‌شده');
        clr.onclick = async () => { await putHandles([]); b.remove(); clr.remove(); say('پوشه‌های ذخیره‌شده پاک شد.'); };
        pick.prepend(clr); pick.prepend(b);
        if (ok.length) loadHandles(ok);
      });
    }
  }

  /* ===== قفل ورود به بخش مدیریت (رمز در کد فقط به‌صورت هش است) ===== */
  const ADMIN_SHA = '3b612c75a7b5048a435fb6ec81e52ff92d6d795a8b5a9c17070f6a63c97a53b2', ADMIN_DJB = 2455702202;
  const djb = (t) => { let h = 5381; for (let i = 0; i < t.length; i++) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0; return h; };
  async function adminPassOk(pw) {
    try {
      if (window.crypto && crypto.subtle) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
        return Array.prototype.map.call(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('') === ADMIN_SHA;
      }
    } catch (e) {}
    return djb(pw) === ADMIN_DJB;   // مرورگرهای قدیمی بدون crypto.subtle
  }
  const adminUnlocked = () => { try { return sessionStorage.getItem('adminOK') === '1'; } catch (e) { return false; } };
  function adminGate() {
    app.replaceChildren();
    const back = el('a', 'back', '→ بازگشت به سریال‌ها'); back.href = '#/'; app.append(back);
    app.append(el('h1', null, 'ورود به مدیریت'));
    const card = el('div', 'card'); card.style.maxWidth = '380px';
    const inp = document.createElement('input'); inp.type = 'password'; inp.placeholder = 'رمز مدیریت'; inp.autocomplete = 'current-password';
    inp.style.cssText = 'width:100%;padding:10px 14px;border-radius:4px;border:1px solid var(--border);background:var(--panel2);color:#fff;font-family:inherit;font-size:1rem;direction:ltr;margin-bottom:10px';
    const msg = el('div', 'err', 'رمز اشتباه است.'); msg.hidden = true; msg.style.marginBottom = '10px';
    const go = el('button', 'btn', 'ورود');
    const submit = async () => {
      if (await adminPassOk(inp.value)) { try { sessionStorage.setItem('adminOK', '1'); } catch (e) {} route(); }
      else { msg.hidden = false; inp.value = ''; inp.focus(); }
    };
    go.onclick = submit; inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
    card.append(inp, msg, go); app.append(card); inp.focus();
  }

  function route() {
    clearTimeout(hoverT); ambient(null);
    onLocal = (location.hash === '#/local'); if (!onLocal) freeUrls();
    if (onLocal) { chrome(false); localPage(); return; }
    const ym = location.hash.match(/^#\/y\/([^/]+)/);
    if (ym) { chrome(false); youtubePage(decodeURIComponent(ym[1])); return; }
    const dm = location.hash.match(/^#\/d\/([^/]+)/);
    if (dm) { chrome(false); drivePage(decodeURIComponent(dm[1])); return; }
    if (location.hash === '#/admin') { chrome(false); if (adminUnlocked()) admin(); else adminGate(); return; }
    const m = location.hash.match(/^#\/s\/([^/]+)\/(\d+)/);
    if (m) { chrome(false); detail(decodeURIComponent(m[1]), parseInt(m[2], 10)); } else home();
  }
  window.addEventListener('hashchange', route);
  q.addEventListener('input', () => { if (location.hash.startsWith('#/s/') || location.hash.startsWith('#/d/') || location.hash.startsWith('#/y/') || location.hash === '#/admin' || location.hash === '#/local') location.hash = '#/'; else home(); });
  /* ابتدا داده‌های مشترک را از Worker/D1 می‌خوانیم؛ در صورت خطا data.json پشتیبان است. */
  function fetchT(url, ms) {
    if (typeof AbortController === 'undefined') return fetch(url, { cache: 'no-store' });
    const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
    return fetch(url, { cache: 'no-store', signal: c.signal }).then(r => { clearTimeout(t); return r; }, e => { clearTimeout(t); throw e; });
  }
  async function loadData(done) {
    let loaded = false;
    if (API_BASE && API_BASE.indexOf('REPLACE-WORKER') < 0) {
      try {
        const r = await fetchT(API_BASE + '/api/library', 5000);
        if (r.ok) {
          const d = await r.json();
          if (Array.isArray(d.series) && d.series.length) {
            SERIES = d.series; DATA_LINKS = Array.isArray(d.links) ? d.links : [];
            DATA_KEY = d.driveKey || ''; custom = []; edits = {}; hidden = []; links = null; driveKey = '';
            try { localStorage.removeItem('custom'); localStorage.removeItem('edits'); localStorage.removeItem('hidden'); localStorage.removeItem('links'); localStorage.removeItem('driveKey'); } catch(e) {}
            loaded = true; cloudReady = true;
          }
        }
      } catch (e) { console.warn('Cloud library unavailable; using data.json fallback.', e); }
    }
    if (!loaded) {
      try {
        const r = await fetchT('data.json?v=' + Date.now(), 5000);
        if (r.ok) {
          const d = await r.json(); const arr = Array.isArray(d) ? d : d.series;
          if (Array.isArray(arr) && arr.length) SERIES = arr;
          if (!Array.isArray(d) && Array.isArray(d.links)) DATA_LINKS = d.links;
          if (!Array.isArray(d) && d.driveKey) DATA_KEY = d.driveKey;
        }
      } catch (e) { console.warn('data.json unavailable; using built-in series list.', e); }
    }
    done();
  }
  /* نمایش فوری از نسخه‌ی ذخیره‌شده؛ نسخه‌ی تازه در پس‌زمینه می‌آید */
  const cached = store.get('libcache', null);
  let rendered = false, cachedSig = '';
  if (cached && Array.isArray(cached.series) && cached.series.length) {
    SERIES = cached.series; DATA_LINKS = cached.links || []; DATA_KEY = cached.driveKey || '';
    cachedSig = JSON.stringify(cached); rendered = true; route();
  }
  loadData(() => {
    const n = custom.length;
    custom = custom.filter(c => !SERIES.some(s => s.id === c.id));
    if (custom.length !== n) persist();
    const fresh = { series: SERIES, links: DATA_LINKS, driveKey: DATA_KEY }, sig = JSON.stringify(fresh);
    try { localStorage.setItem('libcache', sig); } catch (e) {}
    const h = location.hash;
    if (!rendered || (sig !== cachedSig && (h === '' || h === '#/' || h === '#'))) route();
    rendered = true;
  });
})();
</script>
</body>
</html>
