<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#141414">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
<title>کتابخانه سریال</title>
<style>
  :root { --bg:#141414; --panel:#1f1f1f; --panel2:#2a2a2a; --text:#fff; --muted:#a3a3a3; --accent:#e50914; --accent2:#b20710; --border:#333; --hh:68px; }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Vazirmatn",Tahoma,"Segoe UI",system-ui,sans-serif; line-height:1.6; overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }
  button { font-family:inherit; cursor:pointer; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline:3px solid #fff; outline-offset:3px; }

  /* ===== هدر ===== */
  header { position:fixed; top:0; left:0; right:0; z-index:30; display:flex; align-items:center; height:var(--hh); padding:0 4%; background:linear-gradient(to bottom,rgba(0,0,0,.9),rgba(0,0,0,0)); transition:background .3s; }
  header.solid { background:rgba(20,20,20,.97); box-shadow:0 2px 24px rgba(0,0,0,.6); }
  .brand { margin-left:26px; font-weight:900; font-size:1.55rem; color:var(--accent); white-space:nowrap; text-shadow:0 2px 14px rgba(0,0,0,.6); }
  .hnav { display:flex; }
  .hnav button { background:none; border:0; color:#e5e5e5; font-size:.92rem; padding:6px 12px; border-radius:4px; transition:color .2s; white-space:nowrap; }
  .hnav button:hover { color:#9a9a9a; }
  .hnav button.on { color:#fff; font-weight:800; }
  .search { width:190px; margin-right:auto; padding:8px 16px; border-radius:4px; border:1px solid rgba(255,255,255,.35); background:rgba(0,0,0,.45); color:#fff; font-size:.9rem; font-family:inherit; transition:width .3s,border-color .3s; }
  .search:focus { width:300px; border-color:#fff; }
  .search::placeholder { color:#9a9a9a; }
  .adm { margin-right:10px; padding:7px 14px; white-space:nowrap; }

  /* ===== چیدمان صفحه ===== */
  main { display:block; }
  #app.wide { padding:0 0 60px; }
  #app.narrow { max-width:1100px; margin:0 auto; padding:calc(var(--hh) + 22px) 16px 50px; }
  h2 { font-size:1.1rem; margin:24px 0 12px; }
  .empty { color:var(--muted); padding:30px 0; text-align:center; }
  .sec { padding:calc(var(--hh) + 28px) 4% 0; }

  /* ===== دکمه‌ها ===== */
  .btn { display:inline-block; background:var(--accent); color:#fff; border:0; border-radius:4px; padding:9px 20px; font-weight:700; font-size:.92rem; transition:background .2s,opacity .2s; }
  .btn:hover { background:var(--accent2); }
  .btn.ghost { background:rgba(109,109,110,.55); border:0; color:#fff; font-weight:600; }
  .btn.ghost:hover { background:rgba(109,109,110,.8); }
  .btn.light { background:#fff; color:#000; font-weight:800; }
  .btn.light:hover { background:rgba(255,255,255,.75); }
  .btn:disabled { opacity:.4; cursor:not-allowed; }

  /* ===== بنر اصلی ===== */
  .hero { position:relative; min-height:80vh; display:flex; align-items:flex-end; padding:calc(var(--hh) + 40px) 4% 110px; overflow:hidden; background:#000; }
  .hero-bg { position:absolute; top:-40px; left:-40px; right:-40px; bottom:-40px; background-size:cover; background-position:center; -webkit-filter:blur(26px) brightness(.6) saturate(1.25); filter:blur(26px) brightness(.6) saturate(1.25); }
  .hero:before { content:""; position:absolute; top:0; left:0; right:0; bottom:0; background:linear-gradient(to left,rgba(20,20,20,.9) 0%,rgba(20,20,20,.35) 55%,rgba(20,20,20,.55) 100%); }
  .hero:after { content:""; position:absolute; left:0; right:0; bottom:0; height:50%; background:linear-gradient(to bottom,rgba(20,20,20,0),var(--bg)); }
  .hero-in { position:relative; z-index:2; display:flex; align-items:flex-end; width:100%; }
  .hero-txt { flex:1; max-width:560px; }
  .hero-tag { display:inline-block; font-size:.78rem; font-weight:800; letter-spacing:.5px; padding:2px 10px; border-radius:3px; background:var(--accent); margin-bottom:12px; }
  .hero-t { margin:0 0 10px; font-size:2.3rem; font-size:clamp(2.1rem,5.2vw,3.8rem); font-weight:900; line-height:1.25; text-shadow:0 4px 24px rgba(0,0,0,.7); }
  .hero-m { color:#d2d2d2; font-size:1rem; margin-bottom:22px; text-shadow:0 2px 10px rgba(0,0,0,.6); }
  .hero-b .btn { padding:11px 26px; font-size:1.02rem; margin-left:10px; }
  .hero-art { flex:none; width:210px; height:315px; margin-right:auto; border-radius:8px; background-size:cover; background-position:center; box-shadow:0 20px 60px rgba(0,0,0,.75); border:1px solid rgba(255,255,255,.12); }

  /* ===== ردیف‌های افقی ===== */
  .rows { position:relative; z-index:3; margin-top:-80px; }
  .shelf { margin-bottom:6px; }
  .shelf { position:relative; }
  .arr { position:absolute; top:52px; bottom:30px; width:48px; z-index:8; border:0; background:rgba(20,20,20,.75); color:#fff; font-size:2.2rem; line-height:1; opacity:0; transition:opacity .2s,background .2s; }
  .arr.l { left:0; } .arr.r { right:0; }
  .shelf:hover .arr, .arr:focus { opacity:1; }
  .arr:hover { background:rgba(229,9,20,.85); }
  @media (hover:none) { .arr { display:none; } }
  .rowt { font-size:1.3rem; font-weight:800; margin:18px 0 0; padding:0 4%; }
  .rail { display:flex; overflow-x:auto; padding:20px 4% 30px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .rail::-webkit-scrollbar { display:none; }
  .rail .poster { flex:none; margin-left:12px; }

  /* سازگار با مرورگر قدیمی تلویزیون: اول چیدمان flex، و اگر مرورگر grid داشت همان استفاده می‌شود */
  .grid { display:flex; flex-wrap:wrap; margin:16px 0 0; }
  .grid .poster { margin:0 0 14px 12px; }
  @supports (display:grid) {
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); grid-gap:16px; gap:16px; }
    .grid .poster { width:auto; margin:0; }
  }

  /* ===== کارت پوستر ===== */
  .poster { position:relative; display:flex; flex-direction:column; justify-content:flex-end; width:170px; min-height:255px; padding:12px; border-radius:6px; overflow:hidden; background-size:cover; background-position:center; transition:transform .25s,box-shadow .25s; }
  @supports (aspect-ratio:2/3) { .poster { aspect-ratio:2/3; min-height:0; } }
  .poster:after { content:""; position:absolute; left:0; right:0; bottom:0; height:62%; background:linear-gradient(to top,rgba(0,0,0,.92),rgba(0,0,0,0)); z-index:1; }
  .poster:hover, .poster:focus { transform:scale(1.07); z-index:6; box-shadow:0 16px 36px rgba(0,0,0,.75); }
  .poster .name { position:relative; z-index:2; font-weight:800; font-size:1rem; line-height:1.4; text-shadow:0 2px 8px rgba(0,0,0,.6); }
  .poster .cnt { position:relative; z-index:2; font-size:.76rem; color:rgba(255,255,255,.75); margin-top:1px; }
  .poster .ini { position:absolute; top:6px; right:12px; font-size:3.8rem; font-weight:900; opacity:.2; line-height:1; }
  .star { position:absolute; z-index:3; top:8px; left:10px; color:#ffd166; font-size:1.25rem; line-height:1; text-shadow:0 1px 6px rgba(0,0,0,.7); }
  .pbar { position:absolute; z-index:3; left:0; right:0; bottom:0; height:4px; background:rgba(255,255,255,.25); }
  .pbar i { display:block; height:100%; background:var(--accent); }

  /* ===== سایت‌ها و شبکه‌ها ===== */
  .lbox { display:flex; flex-wrap:wrap; padding:14px 4% 0; }
  .lcard { display:flex; align-items:center; background:var(--panel); border-radius:6px; padding:9px 12px; margin:0 0 10px 10px; transition:background .2s; }
  .lcard:hover { background:var(--panel2); }
  .lcard .lkimg { margin-left:10px; }
  .lcard .lname { font-weight:700; margin-left:12px; }
  .lcard .lname:hover { color:var(--accent); }
  .lcard .btn { padding:6px 12px; font-size:.8rem; }

  /* ===== صفحه‌ی پخش ===== */
  .back { display:inline-flex; align-items:center; gap:6px; margin-bottom:14px; color:var(--muted); transition:color .2s; }
  .back:hover { color:#fff; }
  .player-wrap { position:relative; background:#000; border-radius:8px; overflow:hidden; box-shadow:0 18px 60px rgba(0,0,0,.7); }
  video { display:block; width:100%; max-height:74vh; background:#000; }
  .err { padding:10px 14px; background:#3a1214; color:#ffb3b8; font-size:.88rem; }
  .meta { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin:20px 0 8px; }
  .meta h1 { margin:0; font-size:1.8rem; font-weight:900; }
  .meta .ep { color:var(--muted); font-size:.95rem; }
  .nav { display:flex; }
  .nav .btn + .btn { margin-right:8px; }
  .ctl { display:flex; flex-wrap:wrap; margin:6px 0; }
  .ctl .btn { margin:0 0 8px 8px; padding:7px 14px; font-size:.82rem; }
  .chips { display:flex; flex-wrap:wrap; }
  @supports (display:grid) { .chips { display:grid; grid-template-columns:repeat(auto-fill,minmax(70px,1fr)); grid-gap:8px; gap:8px; } .chip { width:auto; margin:0; } }
  .chip { width:70px; margin:0 0 8px 8px; padding:12px 4px; border-radius:4px; border:0; background:var(--panel2); color:#fff; font-weight:700; direction:ltr; transition:background .2s; }
  .chip:hover { background:#3a3a3a; }
  .chip.on { background:var(--accent); color:#fff; }
  .chip.seen { color:var(--muted); }
  .chip.on.seen { color:#fff; }
  .skipfx { position:absolute; top:50%; margin-top:-28px; padding:12px 18px; border-radius:999px; background:rgba(0,0,0,.65); color:#fff; font-weight:700; font-size:1rem; pointer-events:none; opacity:0; transition:opacity .2s; }
  .skipfx.show { opacity:1; }
  .skipfx.r { right:12%; } .skipfx.l { left:12%; }
  .dli { display:block; width:100%; text-align:right; padding:11px 14px; margin-bottom:6px; border-radius:4px; border:0; background:var(--panel2); color:#fff; font-size:.9rem; }
  .dli:hover { background:#3a3a3a; }
  .dli.on { background:var(--accent); color:#fff; }
  .dli.seen { color:var(--muted); } .dli.on.seen { color:#fff; }

  /* ===== مدیریت ===== */
  .card { background:var(--panel); border:1px solid #2c2c2c; border-radius:8px; padding:16px; margin-bottom:16px; }
  .fld { display:block; margin-bottom:12px; }
  .fld span { display:block; font-size:.85rem; color:var(--muted); margin-bottom:4px; }
  .fld small { display:block; color:var(--muted); font-size:.75rem; margin-top:3px; }
  .in { width:100%; padding:10px 12px; border-radius:4px; border:1px solid #3d3d3d; background:#333; color:#fff; font-family:inherit; font-size:.95rem; }
  .in:focus { border-color:#fff; outline:0; }
  .ltr { direction:ltr; text-align:left; }
  .row { display:flex; } .row .fld { flex:1; margin-left:10px; } .row .fld:last-child { margin-left:0; }
  .chk { display:block; margin-bottom:12px; }
  .li { display:flex; align-items:center; padding:9px 0; border-bottom:1px solid #2c2c2c; }
  .li .n { flex:1; } .li .n small { color:var(--muted); }
  .li .btn { margin-right:8px; padding:6px 12px; font-size:.8rem; }
  .msg { color:#ffb3b8; font-size:.88rem; margin:8px 0; min-height:1.2em; }
  .acts .btn { margin-left:8px; }
  .lk { display:flex; flex-wrap:wrap; align-items:center; padding:9px 0; border-bottom:1px solid #2c2c2c; }
  .lk .n { flex:1; min-width:0; } .lk .n small { display:block; color:var(--muted); direction:ltr; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lk .btn { margin-right:8px; margin-top:4px; padding:6px 12px; font-size:.8rem; display:inline-block; }
  select.in { appearance:auto; }
  .lkimg { width:40px; height:40px; margin-left:10px; border-radius:6px; background:var(--panel2); display:flex; align-items:center; justify-content:center; overflow:hidden; font-weight:800; color:var(--muted); flex:none; }
  .lkimg img { width:100%; height:100%; object-fit:cover; }

  /* ===== موبایل ===== */
  @media (max-width:720px) {
    :root { --hh:104px; }
    header { flex-wrap:wrap; align-content:center; padding:6px 4%; }
    .brand { font-size:1.3rem; margin-left:12px; }
    .search { width:120px; padding:6px 12px; } .search:focus { width:150px; }
    .hnav { order:3; width:100%; overflow-x:auto; }
    .hero { min-height:68vh; padding-bottom:90px; }
    .hero-art { display:none; }
    .poster { width:130px; min-height:195px; }
    .rowt { font-size:1.1rem; }
    .meta h1 { font-size:1.4rem; }
  }
</style>
</head>
<body>
<header id="hdr">
  <a class="brand" href="#/" id="brand"></a>
  <nav class="hnav" id="hnav"></nav>
  <input id="q" class="search" type="search" placeholder="جستجوی سریال..." aria-label="جستجو" autocomplete="off">
  <a class="btn ghost adm" href="#/admin">مدیریت</a>
</header>
<main id="app"></main>

<script>
/* ===== این لیست فقط نسخهٔ پشتیبان است. لیست اصلی در فایل data.json کنار همین فایل است و اگر آن لود شود جای این را می‌گیرد. =====
   ===== تنظیمات: =====
   هر سریال: عنوان، بخش ثابت آدرس (تا قبل از شماره‌ی قسمت)، از چند تا چند، تعداد رقم‌های شماره، پسوند.
   وقتی تعداد کل قسمت‌ها را فهمیدی فقط مقدار «to» را عوض کن. poster اختیاری است (آدرس عکس). */
const APP_NAME = 'کتابخانه سریال';
// بعد از ساخت Worker، آدرس workers.dev را اینجا قرار بده.
const API_BASE = 'https://movie-api.usfc26-psn.workers.dev';
let SERIES = [
  { id:'sorkho',    title:'سرخ و سیاه',      base:'https://stream.farsicdn.co/serials2/sorkho/Siah-E',            from:1, to:1,  pad:2, ext:'.mp4' },
  { id:'dore-amir', title:'دور امیر',         base:'https://stream.farsicdn.co/serials2/dore-amir/Dore-Amir-E',   from:1, to:2,  pad:2, ext:'.mp4' },
  { id:'yal',       title:'یل',               base:'https://stream.farsicdn.co/serials2/yal/Yal-E',               from:1, to:2,  pad:2, ext:'.mp4' },
  { id:'boys',      title:'بم استریم بوی',    base:'https://stream.farsicdn.co/serials2/backstream/Boys-E',       from:1, to:17, pad:2, ext:'.mp4' },
  /* prefix: پیشوند نام قسمت در دکمه‌ها (پیش‌فرض E). override: آدرس مخصوص یک قسمت که مسیرش با بقیه فرق دارد. */
  { id:'bamdad-khomar-2', title:'بامداد خمار فصل ۲', prefix:'S2E',
    base:'https://stream.farsicdn.co/serials2/bamdade/Khomar-S2E', from:0, to:13, pad:2, ext:'.mp4',
    override:{ 0:'https://stream.farsicdn.co/serials/bamdade/Khomar-S2E00.mp4' } },
  { id:'eteraf', title:'اعتراف می‌کنم', base:'https://stream.farsicdn.co/serials2/eteraf/Mikonam-E', from:1, to:10, pad:2, ext:'.mp4' },
  { id:'kalagh', title:'کلاغ', base:'https://stream.farsicdn.co/serials2/kalagh/Kalaq-E', from:1, to:11, pad:0, ext:'.mp4',
    override:{ 1:'https://stream.farsicdn.co/serials/kalagh/Kalaq.mp4', 2:'https://stream.farsicdn.co/serials/kalagh/Kalaq-E2.mp4' } },
  { id:'okazion', title:'اکازیون', base:'https://stream.farsicdn.co/serials/okazion/Okazion-E', from:1, to:8, pad:2, ext:'.mp4' },
  /* single:true یعنی فیلم تک‌قسمتی (بدون دکمه‌ی قسمت‌ها). */
  { id:'asb', title:'مردی که اسب شد', single:true, base:'', from:1, to:1, pad:0, ext:'',
    override:{ 1:'https://stream.farsicdn.co/movies/Mardi-Ke-Asb-Shod.mp4' } }
];
/* ======================================= */

/* سازگاری با مرورگر تلویزیون‌های قدیمی‌تر (Tizen): قابلیت‌هایی که ممکن است نداشته باشد */
(function () {
  var P = Element.prototype;
  function toNode(n) { return (typeof n === 'string' || typeof n === 'number') ? document.createTextNode(String(n)) : n; }
  if (!P.append) { P.append = function () { for (var i = 0; i < arguments.length; i++) this.appendChild(toNode(arguments[i])); }; }
  if (!P.replaceChildren) { P.replaceChildren = function () { while (this.firstChild) this.removeChild(this.firstChild); this.append.apply(this, arguments); }; }
  if (!String.prototype.padStart) { String.prototype.padStart = function (len, ch) { var s = String(this); ch = (ch === undefined) ? ' ' : String(ch); while (s.length < len) s = ch + s; return s; }; }
})();

(function () {
  const $ = (s) => document.querySelector(s);
  const app = $('#app'), q = $('#q');
  $('#brand').textContent = APP_NAME; document.title = APP_NAME;

  /* ===== منوی بالا و حالت هدر (سبک نت‌فلیکس) ===== */
  const hdr = $('#hdr'), hnav = $('#hnav');
  let onHome = true;
  let tab = 'all';                             // فیلتر صفحه‌ی اصلی
  [['all', 'همه'], ['series', 'سریال‌ها'], ['movies', 'فیلم‌ها'], ['fav', 'علاقه‌مندی‌ها']].forEach(t => {
    const b = document.createElement('button'); b.textContent = t[1]; b.setAttribute('data-t', t[0]);
    b.onclick = () => { tab = t[0]; q.value = ''; if (location.hash === '' || location.hash === '#/') home(); else location.hash = '#/'; };
    hnav.appendChild(b);
  });
  function paintHdr() { hdr.className = (window.scrollY > 20 || !onHome) ? 'solid' : ''; }
  function chrome(isHome) {
    onHome = isHome; app.className = isHome ? 'wide' : 'narrow';
    for (let i = 0; i < hnav.children.length; i++) hnav.children[i].className = (isHome && hnav.children[i].getAttribute('data-t') === tab) ? 'on' : '';
    paintHdr();
  }
  window.addEventListener('scroll', paintHdr);

  let cloudReady = false;
  let cloudSaveTimer = null;
  let cloudSaving = false;
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) {
      try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
      if (cloudReady && ['custom','edits','hidden','links','driveKey'].indexOf(k) >= 0) queueCloudSave();
    }
  };
  let last = store.get('last', null);          // {id, ep, t}
  let seen = store.get('seen', {});            // {id: [eps]}
  let autoNext = false;
  let custom = store.get('custom', []);        // سریال‌های اضافه‌شده از بخش مدیریت
  let edits = store.get('edits', {});          // تغییرات روی سریال‌های پیش‌فرض {id: سریال}
  let hidden = store.get('hidden', []);        // شناسه‌ی سریال‌های پنهان‌شده
  let favs = store.get('favs', []);            // علاقه‌مندی‌ها (فقط روی همین دستگاه)
  let speed = store.get('speed', 1);           // سرعت پخش
  let links = store.get('links', null);        // سایت‌ها و شبکه‌ها (null یعنی از data.json)
  let DATA_LINKS = [];
  let driveKey = store.get('driveKey', '');     // کلید API گوگل درایو
  let DATA_KEY = '';
  const getKey = () => driveKey || DATA_KEY;
  const getLinks = () => links || DATA_LINKS;
  const eff = (s) => edits[s.id] || s;
  const all = () => SERIES.filter(s => hidden.indexOf(s.id) < 0).map(eff).concat(custom);
  const persist = () => { store.set('edits', edits); store.set('custom', custom); store.set('hidden', hidden); };

  function cloudStatus(message) {
    const node = document.getElementById('cloud-save-status');
    if (node) node.textContent = message;
  }
  async function cloudToken() {
    let token = sessionStorage.getItem('serialLibraryAdminToken');
    if (token) return token;
    const password = prompt('رمز مدیریت برای ذخیره تغییرات مشترک را وارد کن:');
    if (!password) throw new Error('ورود مدیریت لغو شد.');
    const response = await fetch(API_BASE + '/api/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({password})
    });
    if (!response.ok) throw new Error('رمز مدیریت نادرست است یا سرویس در دسترس نیست.');
    const result = await response.json();
    token = result.token;
    sessionStorage.setItem('serialLibraryAdminToken', token);
    return token;
  }
  async function saveCloudNow() {
    if (!API_BASE || API_BASE.indexOf('REPLACE-WORKER') >= 0) {
      cloudStatus('برای فعال شدن ذخیره خودکار، آدرس Worker را در تنظیمات فایل وارد کن.');
      return;
    }
    if (cloudSaving) return;
    cloudSaving = true;
    try {
      const token = await cloudToken();
      const payload = {series: all(), links: getLinks(), driveKey: getKey()};
      const response = await fetch(API_BASE + '/api/library', {
        method: 'PUT', headers: {'Content-Type':'application/json','Authorization':'Bearer '+token},
        body: JSON.stringify(payload)
      });
      if (response.status === 401) { sessionStorage.removeItem('serialLibraryAdminToken'); throw new Error('نشست مدیریت منقضی شد؛ دوباره ذخیره کن.'); }
      if (!response.ok) throw new Error('ذخیره روی سرور ناموفق بود (' + response.status + ').');
      cloudStatus('✓ تغییرات با موفقیت برای همه ذخیره شد.');
    } catch (error) {
      cloudStatus('ذخیره خودکار انجام نشد: ' + error.message);
    } finally { cloudSaving = false; }
  }
  function queueCloudSave() {
    cloudStatus('تغییرات در صف ذخیره‌سازی...');
    clearTimeout(cloudSaveTimer);
    cloudSaveTimer = setTimeout(saveCloudNow, 900);
  }

  function copyText(txt, cb) {
    const fb = () => { const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); cb(true); } catch (e) { cb(false); } document.body.removeChild(t); };
    try { navigator.clipboard.writeText(txt).then(() => cb(true), fb); } catch (e) { fb(); }
  }

  function detail(id, ep) {
    const s = byId(id);
    if (!s) { location.hash = '#/'; return; }
    ep = Math.min(s.to, Math.max(s.from, ep || s.from));
    app.replaceChildren();

    const back = el('a', 'back', '→ همه‌ی سریال‌ها'); back.href = '#/'; app.append(back);

    const wrap = el('div', 'player-wrap');
    const v = document.createElement('video');
    v.controls = true; v.playsInline = true; v.preload = 'metadata'; v.src = epUrl(s, ep);
    const err = el('div', 'err', 'این قسمت بارگذاری نشد. ممکن است در سرور وجود نداشته باشد یا نامش با الگو فرق کند.'); err.hidden = true;
    v.addEventListener('error', () => { err.hidden = false; });
    v.addEventListener('loadedmetadata', () => {
      if (last && last.id === id && last.ep === ep && last.t > 5 && last.t < v.duration - 10) v.currentTime = last.t;
    });
    let tick = 0;
    v.addEventListener('timeupdate', () => {
      const now = Date.now(); if (now - tick < 4000) return; tick = now;
      last = { id, ep, t: Math.floor(v.currentTime) }; store.set('last', last);
    });
    v.addEventListener('ended', () => {
      (seen[id] = seen[id] || []); if (!seen[id].includes(ep)) { seen[id].push(ep); store.set('seen', seen); }
      last = { id, ep, t: 0 }; store.set('last', last);
      if (ep < s.to) { autoNext = true; location.hash = '#/s/' + id + '/' + (ep + 1); }
    });
    wrap.append(v, err); app.append(wrap);

    /* دو بار لمس/کلیک سریع روی سمت راست ویدیو = ۱۵ ثانیه جلو، سمت چپ = ۱۵ ثانیه عقب */
    const SK = 15, fx = el('div', 'skipfx'); wrap.append(fx);
    let fxT = 0, lc = { t: 0, side: 0 };
    const jump = (d) => {
      v.currentTime = Math.max(0, Math.min(v.duration || 1e9, v.currentTime + d));
      fx.textContent = (d > 0 ? '+' : '−') + toFa(SK) + ' ثانیه';
      fx.className = 'skipfx show ' + (d > 0 ? 'r' : 'l');
      clearTimeout(fxT); fxT = setTimeout(() => { fx.className = 'skipfx'; }, 700);
    };
    v.addEventListener('click', (e) => {
      const r = v.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      const side = x > 0.6 ? 1 : (x < 0.4 ? -1 : 0), now = Date.now();
      if (y > 0.82 || !side) { lc.t = 0; return; }               // نوار کنترل پایین و وسط ویدیو نادیده گرفته می‌شود
      if (now - lc.t < 350 && lc.side === side) { lc.t = 0; jump(side * SK); } else { lc = { t: now, side: side }; }
    });

    const meta = el('div', 'meta');
    const left = el('div'); left.append(el('h1', null, s.title), el('div', 'ep', s.single ? 'فیلم' : 'قسمت ' + toFa(ep) + ' از ' + toFa(s.to)));
    const nav = el('div', 'nav');
    const prev = el('button', 'btn ghost', 'قسمت قبل'); prev.disabled = ep <= s.from;
    const next = el('button', 'btn', 'قسمت بعد'); next.disabled = ep >= s.to;
    prev.onclick = () => { location.hash = '#/s/' + id + '/' + (ep - 1); };
    next.onclick = () => { location.hash = '#/s/' + id + '/' + (ep + 1); };
    if (s.single) { meta.append(left); } else { nav.append(prev, next); meta.append(left, nav); }
    app.append(meta);

    /* ===== امکانات جدید: علاقه‌مندی، ۱۰ ثانیه جلو/عقب، سرعت پخش، علامت دیده‌شده ===== */
    const ctl = el('div', 'ctl');
    const favB = el('button', 'btn ghost');
    const paintFav = () => { favB.textContent = favs.indexOf(id) >= 0 ? '★ در علاقه‌مندی‌ها' : '☆ علاقه‌مندی'; };
    paintFav();
    favB.onclick = () => { const i = favs.indexOf(id); if (i >= 0) favs.splice(i, 1); else favs.push(id); store.set('favs', favs); paintFav(); };
    const bk10 = el('button', 'btn ghost', '۱۵ ثانیه عقب'); bk10.onclick = () => { jump(-SK); };
    const fw10 = el('button', 'btn ghost', '۱۵ ثانیه جلو'); fw10.onclick = () => { jump(SK); };
    const SPEEDS = [1, 1.25, 1.5, 2, 0.75];
    const spB = el('button', 'btn ghost');
    const paintSp = () => { spB.textContent = 'سرعت ' + toFa(speed) + '×'; };
    paintSp();
    v.addEventListener('loadedmetadata', () => { v.playbackRate = speed; });
    spB.onclick = () => { speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]; store.set('speed', speed); v.playbackRate = speed; paintSp(); };
    const seenB = el('button', 'btn ghost');
    const isSeen = () => (seen[id] || []).indexOf(ep) >= 0;
    const paintSeen = () => { seenB.textContent = isSeen() ? '✓ دیده شده (برداشتن)' : 'علامت‌گذاری به‌عنوان دیده‌شده'; };
    paintSeen();
    seenB.onclick = () => {
      const a = (seen[id] = seen[id] || []), i = a.indexOf(ep);
      if (i >= 0) a.splice(i, 1); else a.push(ep);
      store.set('seen', seen); paintSeen();
      const c = app.querySelectorAll('.chip')[ep - s.from];
      if (c) { if (isSeen()) c.classList.add('seen'); else c.classList.remove('seen'); }
    };
    ctl.append(favB, bk10, fw10, spB, seenB); app.append(ctl);

    if (!s.single) {
      app.append(el('h2', null, 'قسمت‌ها'));
      const chips = el('div', 'chips');
      for (let n = s.from; n <= s.to; n++) {
        const b = el('button', 'chip' + (n === ep ? ' on' : '') + ((seen[id] || []).includes(n) ? ' seen' : ''), epLabel(s, n));
        b.onclick = () => { location.hash = '#/s/' + id + '/' + n; };
        chips.append(b);
      }
      app.append(chips);
    }

    last = (last && last.id === id && last.ep === ep) ? last : { id, ep, t: 0 }; store.set('last', last);
    if (autoNext) { autoNext = false; v.play().catch(() => {}); }
    window.scrollTo(0, 0);
  }

  function admin() {
    app.replaceChildren();

       یوزر و پسورد فقط روی همین دستگاه می‌ماند و هرگز در خروجی یا data.json نمی‌رود. */

    };
    const lkKind = document.createElement('select'); lkKind.className = 'in';

    const paintLinks = () => {
      lkList.replaceChildren();
      const L = getLinks(), C = creds();
      if (!L.length) lkList.append(el('div', 'empty', 'هنوز سایت یا شبکه‌ای اضافه نشده.'));
      L.forEach(x => {
        const li = el('div', 'lk');
        const th = el('div', 'lkimg');
        if (x.img) { const im = document.createElement('img'); im.src = x.img; im.alt = ''; im.onerror = () => { th.textContent = x.name[0]; im.remove(); }; th.append(im); } else th.textContent = x.name[0];
        const n = el('div', 'n', (x.kind === 'network' ? 'شبکه · ' : x.kind === 'drive' ? 'پوشه درایو · ' : 'سایت · ') + x.name);
        n.append(el('small', null, x.url));
        const o = el('a', 'btn', x.kind === 'drive' ? 'پخش' : 'باز کردن'); if (x.kind === 'drive') o.href = '#/d/' + x.id; else { o.href = x.url; o.target = '_blank'; o.rel = 'noopener noreferrer'; }

        const c = C[x.id];

    lkAdd.onclick = () => {

      links = lkEdit ? L.map(y => y.id === id ? o : y) : L.concat([o]);
      store.set('links', links);
      const cc = creds(); if (lkUser.value.trim() || lkPass.value) cc[id] = { u: lkUser.value.trim(), p: lkPass.value }; else delete cc[id];
      store.set('linkcreds', cc);
      clearForm(); paintLinks();
    };
    lkCancel.onclick = clearForm;
    paintLinks();
    const lkActs = el('div', 'acts'); lkActs.append(lkAdd, lkCancel);
    lkCard.append(lkList, row(field('نوع', lkKind), field('نام', lkName)), field('آدرس', lkUrl), field('عکس / لوگو', lkImg),
      row(field('نام کاربری', lkUser), field('رمز عبور', lkPass)),
      el('small', null, 'یوزر و پسورد فقط روی همین دستگاه ذخیره می‌شود و در خروجی/GitHub نمی‌رود. سایت‌ها اجازه‌ی پر شدن خودکار از بیرون را نمی‌دهند؛ با دکمه‌های «کپی» در صفحه‌ی ورود جای‌گذاری کن.'),
      field('کلید API گوگل درایو (فقط برای نوع «پوشه‌ی درایو»)', keyIn, 'در Google Cloud یک API key بساز، Google Drive API را فعال کن و کلید را فقط به همان API محدود کن (محدودیت referrer نگذار). پوشه باید روی «Anyone with the link» باشد.'),
      lkMsg, lkActs);
    app.append(lkCard);

    app.append(el('h2', null, cur ? 'ویرایش: ' + cur.title : 'افزودن سریال یا فیلم'));

    const ov = (cur && cur.override) || {}, single = !!(cur && cur.single);
    const card = el('div', 'card');
    const sample = inp('ltr', '', 'https://.../Name-E01.mp4');
    const title = inp('', cur ? cur.title : '');
    const chk = document.createElement('input'); chk.type = 'checkbox'; chk.checked = single;
    const chkL = el('label', 'chk'); chkL.append(chk, el('span', null, ' فیلم تک‌قسمتی است (در «آدرس پایه» لینک کامل فیلم را بگذار)'));
    const base = inp('ltr', single ? (ov[1] || '') : (cur ? cur.base : ''), 'https://.../Name-E');
    const from = inp('ltr', cur ? cur.from : 1), to = inp('ltr', cur ? cur.to : 1), pad = inp('ltr', cur ? cur.pad : 2);
    const prefix = inp('ltr', cur ? (cur.prefix || '') : '', 'E'), ext = inp('ltr', cur ? cur.ext : '.mp4');
    const poster = inp('ltr', cur ? (cur.poster || '') : '', 'اختیاری');
    const ovT = document.createElement('textarea'); ovT.className = 'in ltr'; ovT.rows = 3; ovT.placeholder = '3=https://...';
    ovT.value = single ? '' : Object.keys(ov).map(k => k + '=' + ov[k]).join('\n');

    sample.addEventListener('input', () => {
      const m = sample.value.trim().match(/^(.*?)(\d+)(\.[A-Za-z0-9]+)$/);
      if (!m) return;
      base.value = m[1]; ext.value = m[3]; pad.value = m[2].charAt(0) === '0' ? m[2].length : 0;
      if (!from.value || from.value === '1') from.value = parseInt(m[2], 10);
    });

    card.append(
      field('لینک یک قسمت نمونه (برای پر شدن خودکار)', sample, 'مثلا لینک قسمت ۱؛ آدرس پایه، رقم‌ها و پسوند خودکار پر می‌شود.'),
      field('عنوان', title), chkL, field('آدرس پایه (تا قبل از شماره‌ی قسمت)', base),
      row(field('از قسمت', from), field('تا قسمت', to), field('تعداد رقم', pad)),
      row(field('پیشوند دکمه‌ها', prefix), field('پسوند فایل', ext)),
      field('آدرس عکس پوستر', poster),
      field('آدرس‌های استثنا (هر خط: شماره=لینک)', ovT, 'برای قسمت‌هایی که مسیرشان با بقیه فرق دارد.')
    );
    const msg = el('div', 'msg');
    const save = el('button', 'btn', cur ? 'ذخیره‌ی تغییرات' : 'افزودن');
    const acts = el('div', 'acts'); acts.append(save);
    if (cur) { const c = el('button', 'btn ghost', 'انصراف'); c.onclick = () => { editId = null; admin(); }; acts.append(c); }
    save.onclick = () => {
      const t = title.value.trim(), b = base.value.trim();
      if (!t || !b) { msg.textContent = 'عنوان و آدرس پایه الزامی است.'; return; }
      const o = { id: cur ? cur.id : 'c' + Date.now(), title: t };
      if (chk.checked) { o.single = true; o.base = ''; o.from = 1; o.to = 1; o.pad = 0; o.ext = ''; o.override = { 1: b }; }
      else {
        const f = parseInt(from.value, 10), e2 = parseInt(to.value, 10);
        if (isNaN(f) || isNaN(e2) || e2 < f) { msg.textContent = 'محدوده‌ی قسمت‌ها درست نیست.'; return; }
        o.base = b; o.from = f; o.to = e2; o.pad = parseInt(pad.value, 10) || 0; o.ext = ext.value.trim();
        if (prefix.value.trim()) o.prefix = prefix.value.trim();
        const od = {};
        ovT.value.split('\n').forEach(line => { const m = line.match(/^\s*(\d+)\s*=\s*(\S+)/); if (m) od[parseInt(m[1], 10)] = m[2]; });
        if (Object.keys(od).length) o.override = od;
      }
      if (poster.value.trim()) o.poster = poster.value.trim();
      if (cur && isDef) edits[cur.id] = o; else if (cur) custom[custom.indexOf(cur)] = o; else custom.push(o);
      persist(); editId = null; admin(); window.scrollTo(0, 0);
    };
    card.append(msg, acts); app.append(card);

    app.append(el('h2', null, 'سریال‌های شما'));
    const mine = el('div', 'card');
    if (!custom.length) mine.append(el('div', 'empty', 'هنوز چیزی اضافه نکرده‌ای.'));
    custom.forEach(s => {
      const li = el('div', 'li'); const n = el('div', 'n', s.title + ' '); n.append(el('small', null, s.single ? '(فیلم)' : '(' + toFa(count(s)) + ' قسمت)'));
      const e = el('button', 'btn ghost', 'ویرایش'); e.onclick = () => { editId = s.id; admin(); window.scrollTo(0, 0); };
      const d = el('button', 'btn ghost', 'حذف'); d.onclick = () => { if (confirm('«' + s.title + '» حذف شود؟')) { custom.splice(custom.indexOf(s), 1); persist(); admin(); } };
      li.append(n); const pb = plusBtn(s); if (pb) li.append(pb); li.append(e, d); mine.append(li);
    });
    app.append(mine);

    app.append(el('h2', null, 'سریال‌های پیش‌فرض'));
    const def = el('div', 'card');
    SERIES.forEach(d0 => {
      const s = eff(d0), off = hidden.indexOf(s.id) >= 0;
      const li = el('div', 'li'); const n = el('div', 'n', s.title + ' '); n.append(el('small', null, s.single ? '(فیلم)' : '(' + toFa(count(s)) + ' قسمت)'));
      li.append(n); const pb = plusBtn(s); if (pb) li.append(pb);
      const e = el('button', 'btn ghost', 'ویرایش'); e.onclick = () => { editId = s.id; admin(); window.scrollTo(0, 0); };
      const b = el('button', 'btn ghost', off ? 'نمایش' : 'پنهان');
      b.onclick = () => { if (off) hidden.splice(hidden.indexOf(s.id), 1); else hidden.push(s.id); persist(); admin(); };
      li.append(e, b);
      if (edits[s.id]) { const r = el('button', 'btn ghost', 'بازنشانی'); r.onclick = () => { if (confirm('تغییرات «' + s.title + '» برگردد به حالت اولیه؟')) { delete edits[s.id]; persist(); admin(); } }; li.append(r); }
      def.append(li);
    });
    app.append(def);

    app.append(el('h2', null, 'پشتیبان‌گیری / انتقال به دستگاه دیگر'));
    const bk = el('div', 'card'); const ta = document.createElement('textarea'); ta.className = 'in ltr'; ta.rows = 4;
    const ex = el('button', 'btn ghost', 'ساخت خروجی'), im = el('button', 'btn ghost', 'وارد کردن');
    const bm = el('div', 'msg');
    ex.onclick = () => { ta.value = JSON.stringify({ series: all(), links: getLinks(), driveKey: getKey() }, null, 2); ta.select(); bm.textContent = 'این خروجی برای پشتیبان‌گیری دستی است؛ تغییرات عادی به‌صورت خودکار در پایگاه داده مشترک ذخیره می‌شوند.'; };
    im.onclick = () => {
      try {
        const d = JSON.parse(ta.value);
        if (Array.isArray(d.series)) {
          custom = []; edits = {}; hidden = [];
          if (Array.isArray(d.links)) { links = d.links; store.set('links', links); }
          if (d.driveKey) { driveKey = d.driveKey; store.set('driveKey', driveKey); }
          d.series.forEach(x => { if (SERIES.some(y => y.id === x.id)) edits[x.id] = x; else custom.push(x); });
        } else {
          if (!Array.isArray(d.custom)) throw 0;
          custom = d.custom; hidden = Array.isArray(d.hidden) ? d.hidden : []; edits = d.edits || {};
        }
        persist(); admin();
      }
      catch (e) { bm.textContent = 'متن واردشده معتبر نیست.'; }
    };
    const clr = el('button', 'btn ghost', 'پاک کردن تغییرات این دستگاه');
    clr.onclick = () => {
      if (!confirm('تغییرات ذخیره‌شده روی این دستگاه پاک شود؟ فقط آنچه در data.json هست می‌ماند.')) return;
      custom = []; edits = {}; hidden = []; persist(); admin();
    };
    const ba = el('div', 'acts'); ba.append(ex, im, clr); bk.append(ta, bm, ba); app.append(bk);

    /* ذخیره مستقیم GitHub حذف شده؛ ذخیره‌سازی از طریق Worker و D1 انجام می‌شود. */
    window.scrollTo(0, 0);
  }

  /* ===== پلی‌لیست پوشه‌ی گوگل درایو ===== */
  function getJSON(url, ok, bad) {
    const x = new XMLHttpRequest(); x.open('GET', url, true);
    x.onreadystatechange = () => {
      if (x.readyState !== 4) return;
      let j = null; try { j = JSON.parse(x.responseText); } catch (e) {}
      if (x.status === 200 && j) ok(j); else bad((j && j.error && j.error.message) || ('خطا ' + x.status));
    };
    x.onerror = () => bad('اتصال به گوگل برقرار نشد.');
    x.send();
  }
  const driveCache = {};
  function folderId(u) { const m = u.match(/\/folders\/([\w-]+)/) || u.match(/[?&]id=([\w-]+)/); return m ? m[1] : ''; }

  function drivePage(id) {
    const x = getLinks().find(y => y.id === id);
    if (!x) { location.hash = '#/'; return; }
    app.replaceChildren();
    const back = el('a', 'back', '→ همه‌ی سریال‌ها'); back.href = '#/'; app.append(back);
    app.append(el('h1', null, x.name));
    const fid = folderId(x.url), key = getKey();
    if (!fid) { app.append(el('div', 'err', 'آدرس پوشه معتبر نیست. لینک خود پوشه را بگذار (…/folders/…).')); return; }
    if (!key) { const e = el('div', 'err', 'کلید API گوگل درایو تنظیم نشده. ');  const a = el('a', null, 'رفتن به مدیریت'); a.href = '#/admin'; a.style.textDecoration = 'underline'; e.append(a); app.append(e); return; }
    const status = el('div', 'empty', 'در حال خواندن پوشه...'); app.append(status);
    const show = (files) => {
      status.remove();
      if (!files.length) { app.append(el('div', 'empty', 'ویدیویی در این پوشه پیدا نشد (فقط فایل‌های مستقیم پوشه، نه زیرپوشه‌ها).')); return; }
      const dpos = store.get('dpos', {}), dseen = store.get('dseen', {});
      let cur = Math.min(files.length - 1, Math.max(0, dpos[id] || 0)), useFrame = false;
      const wrap = el('div', 'player-wrap'), host = el('div'); wrap.append(host); app.append(wrap);
      const err = el('div', 'err', 'پخش مستقیم نشد (محدودیت گوگل یا فایل بزرگ). با «پلیر گوگل» امتحان کن.'); err.hidden = true; app.append(err);
      const title = el('h2'), meta = el('div', 'meta'); const nav = el('div', 'nav');
      const prev = el('button', 'btn ghost', 'قبلی'), next = el('button', 'btn', 'بعدی');
      nav.append(prev, next); meta.append(title, nav); app.append(meta);
      const ctl = el('div', 'ctl'); const frB = el('button', 'btn ghost', 'پلیر گوگل'), spB = el('button', 'btn ghost');
      const SPEEDS = [1, 1.25, 1.5, 2, 0.75]; const paintSp = () => { spB.textContent = 'سرعت ' + toFa(speed) + '×'; }; paintSp();
      ctl.append(frB, spB); app.append(ctl);
      app.append(el('h2', null, 'پلی‌لیست (' + toFa(files.length) + ' ویدیو)'));
      const list = el('div', 'dl'); app.append(list);
      const items = files.map((f, i) => { const b = el('button', 'dli', f.name); b.dir = 'auto'; b.onclick = () => play(i); list.append(b); return b; });
      let v = null;
      function play(i) {
        cur = i; dpos[id] = i; store.set('dpos', dpos); err.hidden = true;
        const f = files[i]; title.textContent = f.name; title.dir = 'auto';
        prev.disabled = i <= 0; next.disabled = i >= files.length - 1;
        items.forEach((b, k) => { b.className = 'dli' + (k === i ? ' on' : '') + ((dseen[id] || []).indexOf(files[k].id) >= 0 ? ' seen' : ''); });
        host.replaceChildren(); v = null;
        if (useFrame) {
          const fr = document.createElement('iframe'); fr.src = 'https://drive.google.com/file/d/' + f.id + '/preview'; fr.allowFullscreen = true;
          fr.setAttribute('allow', 'autoplay; fullscreen'); fr.style.cssText = 'width:100%;height:60vh;border:0;display:block;background:#000'; host.append(fr); frB.textContent = 'پلیر معمولی';
        } else {
          v = document.createElement('video'); v.controls = true; v.playsInline = true; v.preload = 'metadata';
          v.src = 'https://www.googleapis.com/drive/v3/files/' + f.id + '?alt=media&key=' + encodeURIComponent(key);
          v.addEventListener('error', () => { err.hidden = false; });
          v.addEventListener('loadedmetadata', () => { v.playbackRate = speed; });
          v.addEventListener('ended', () => {
            const a = (dseen[id] = dseen[id] || []); if (a.indexOf(f.id) < 0) { a.push(f.id); store.set('dseen', dseen); }
            if (cur < files.length - 1) { play(cur + 1); v.play().catch(() => {}); }
          });
          host.append(v); frB.textContent = 'پلیر گوگل';
        }
      }
      prev.onclick = () => play(cur - 1); next.onclick = () => play(cur + 1);
      frB.onclick = () => { useFrame = !useFrame; play(cur); };
      spB.onclick = () => { speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]; store.set('speed', speed); if (v) v.playbackRate = speed; paintSp(); };
      play(cur); window.scrollTo(0, 0);
    };
    if (driveCache[fid]) { show(driveCache[fid]); return; }
    const url = 'https://www.googleapis.com/drive/v3/files?q=' + encodeURIComponent("'" + fid + "' in parents and trashed=false and mimeType contains 'video/'") +
      '&fields=' + encodeURIComponent('files(id,name,mimeType)') + '&pageSize=1000&key=' + encodeURIComponent(key);
    getJSON(url, j => {
      const f = (j.files || []).sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
      driveCache[fid] = f; show(f);
    }, msg => { status.className = 'err'; status.textContent = 'خواندن پوشه ناموفق بود: ' + msg + ' (پوشه باید «Anyone with the link» باشد و کلید API درست.)'; });
  }

  function route() {
    const dm = location.hash.match(/^#\/d\/([^/]+)/);
    if (dm) { chrome(false); drivePage(decodeURIComponent(dm[1])); return; }
    if (location.hash === '#/admin') { chrome(false); admin(); return; }
    const m = location.hash.match(/^#\/s\/([^/]+)\/(\d+)/);
    if (m) { chrome(false); detail(decodeURIComponent(m[1]), parseInt(m[2], 10)); } else home();
  }
  window.addEventListener('hashchange', route);
  q.addEventListener('input', () => { if (location.hash.startsWith('#/s/') || location.hash.startsWith('#/d/') || location.hash === '#/admin') location.hash = '#/'; else home(); });
  /* ابتدا داده‌های مشترک را از Worker/D1 می‌خوانیم؛ در صورت خطا data.json پشتیبان است. */
  async function loadData(done) {
    let loaded = false;
    if (API_BASE && API_BASE.indexOf('REPLACE-WORKER') < 0) {
      try {
        const r = await fetch(API_BASE + '/api/library', {cache:'no-store'});
        if (r.ok) {
          const d = await r.json();
          if (Array.isArray(d.series) && d.series.length) {
            SERIES = d.series; DATA_LINKS = Array.isArray(d.links) ? d.links : [];
            DATA_KEY = d.driveKey || ''; custom = []; edits = {}; hidden = []; links = null; driveKey = '';
            try { localStorage.removeItem('custom'); localStorage.removeItem('edits'); localStorage.removeItem('hidden'); localStorage.removeItem('links'); localStorage.removeItem('driveKey'); } catch(e) {}
            loaded = true; cloudReady = true;
          }
        }
      } catch (e) { console.warn('Cloud library unavailable; using data.json fallback.', e); }
    }
    if (!loaded) {
      try {
        const r = await fetch('data.json?v=' + Date.now(), {cache:'no-store'});
        if (r.ok) {
          const d = await r.json(); const arr = Array.isArray(d) ? d : d.series;
          if (Array.isArray(arr) && arr.length) SERIES = arr;
          if (!Array.isArray(d) && Array.isArray(d.links)) DATA_LINKS = d.links;
          if (!Array.isArray(d) && d.driveKey) DATA_KEY = d.driveKey;
        }
      } catch (e) { console.warn('data.json unavailable; using built-in series list.', e); }
    }
    done();
  }
  loadData(() => {
    const n = custom.length;
    custom = custom.filter(c => !SERIES.some(s => s.id === c.id));
    if (custom.length !== n) persist();
    route();
  });
})();
</script>
